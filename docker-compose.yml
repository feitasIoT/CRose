services:

  # 2. Nginx 容器：作为流量分发入口
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
    networks:
      - crose-net

  crose-db:
    image: pgvector/pgvector:0.8.2-pg14-trixie
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - ./config/pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql
      - crose_pgvector:/var/lib/postgresql/data
    networks:
      - crose-net

  crose-volume-init:
    image: alpine:3.20
    command:
      - sh
      - -lc
      - mkdir -p /mnt/ai-datasets /mnt/ai-loras && chown -R 100:101 /mnt/ai-datasets /mnt/ai-loras && chmod -R ug+rwX /mnt/ai-datasets /mnt/ai-loras
    volumes:
      - crose-datasets:/mnt/ai-datasets
      - crose-loras:/mnt/ai-loras
    restart: "no"
    networks:
      - crose-net

  crose-web:
    build: 
      context: .
      dockerfile: ./crose/Dockerfile
    depends_on:
      crose-db:
        condition: service_started
      crose-ai:
        condition: service_started
      crose-volume-init:
        condition: service_completed_successfully
    ports:
      - "8069:8069"
    restart: always
    volumes:
      - ./config/crose/odoo.conf:/etc/odoo/odoo.conf
      - ./crose:/mnt/extra-addons/crose
      - crose_odoo:/var/lib/odoo
      - crose_verdaccio_staging:/mnt/verdaccio-staging:ro
      - crose_verdaccio_prod:/mnt/verdaccio-prod:rw
      - crose-datasets:/mnt/ai-datasets
      - crose-loras:/mnt/ai-loras
    environment:
      - HOST=crose-db
      - USER=odoo
      - PASSWORD=odoo
      - DB_NAME=crose
      - CROSE_AI_DATASET_ROOT=/mnt/ai-datasets
    networks:
      - crose-net

  crose-ai:
    build:
      context: .
      dockerfile: ./ai/Dockerfile
    restart: always
    volumes:
      - ./ai:/app
      - crose_ai:/root/.cache/torch
      - ./config/ai:/app/ai_config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    environment:
      - CROSE_TRAIN_CONTAINER_NAME=crose-ai-train
      - CROSE_TRAIN_YAML_DIR=/app/ai_config/generated
      - CROSE_TRAIN_LOG_DIR=/app/output
      - CROSE_VLLM_BASE_URL=http://crose-vllm:8000
      - CROSE_VLLM_CHAT_API_PATH=/v1/chat/completions
      - CROSE_VLLM_LOAD_ADAPTER_API_PATH=/v1/load_lora_adapter
      - CROSE_VLLM_UNLOAD_ADAPTER_API_PATH=/v1/unload_lora_adapter
    networks:
      - crose-net

  gmqtt:
    build:
      context: ./gmqtt
      dockerfile: Dockerfile
    working_dir: /gmqtt_data
    restart: always
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    volumes:
      - ./config/gmqtt:/etc/gmqtt
      - crose_gmqtt:/gmqtt_data
    command: ["gmqttd", "start", "-c", "/etc/gmqtt/gmqttd.yml"]
    networks:
      - crose-net

  nodered-prod:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8880:1880"
    volumes:
      - ./config/nodered-prod/settings.js:/data/settings.js
      - crose_nodered_prod:/data
      - crose_webdav:/mnt/webdav
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - crose-net

  nodered-staging:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    user: "0:0"
    restart: always
    ports:
      - "8881:1880"
    volumes:
      - ./config/nodered-staging/settings.js:/data/settings.js
      - crose_nodered_staging:/data
      - crose_webdav:/mnt/webdav
      - ./demo/samba:/mnt/samba
    networks:
      - crose-net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/users.acl ]; then
          printf '%s\n' "user default on nopass ~* &* +@all" > /data/users.acl
        fi
        exec redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - crose_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crose-net

  iotdb:
    image: apache/iotdb:2.0.7-standalone
    hostname: iotdb
    container_name: iotdb
    restart: always
    privileged: true
    ports:
      - "6667:6667"
      - "18883:1883"
    environment:
      - cn_internal_address=127.0.0.1
      - cn_internal_port=10710
      - cn_consensus_port=10720
      - cn_seed_config_node=127.0.0.1:10710
      - dn_rpc_address=0.0.0.0
      - dn_internal_address=127.0.0.1
      - dn_rpc_port=6667
      - dn_internal_port=10730
      - dn_mpp_data_exchange_port=10740
      - dn_schema_region_consensus_port=10750
      - dn_data_region_consensus_port=10760
      - dn_seed_config_node=127.0.0.1:10710
    volumes:
      - crose_iotdb_datas:/iotdb/data
      - crose_iotdb_logs:/iotdb/logs
      - ./config/iotdb/iotdb-system.properties:/iotdb/conf/iotdb-system.properties
    networks:
      - crose-net

  verdaccio-staging:
    image: verdaccio/verdaccio:latest
    container_name: verdaccio-staging
    restart: always
    ports:
      - "4873:4873"
    volumes:
      - ./config/verdaccio/staging:/verdaccio/conf
      - crose_verdaccio_staging:/verdaccio/storage
    networks:
      - crose-net

  verdaccio-prod:
    image: verdaccio/verdaccio:latest
    container_name: verdaccio-prod
    restart: always
    ports:
      - "4874:4873"
    volumes:
      - ./config/verdaccio/production:/verdaccio/conf
      - crose_verdaccio_prod:/verdaccio/storage
    networks:
      - crose-net
  
  crose-webdav:
    build:
      context: ./webdav
      dockerfile: Dockerfile
    container_name: crose-webdav
    user: "0:0"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:6065"
    volumes:
      - crose_webdav:/data          # 映射到容器内的 /data
      - ./config/webdav/config.yaml:/config.yaml # 需要提供一个基础配置文件
    environment:
      WD_REDIS_ENABLED: "true"
      WD_REDIS_ADDR: "redis:6379"
      WD_REDIS_KEY_PREFIX: "webdav:"
      WD_REDIS_SEED_FROM_CONFIG: "true"
    command: ["--config", "/config.yaml"]
    restart: unless-stopped
    networks:
      - crose-net
  
  frps:
    image: frp/frps:local
    build:
      context: ./frp
      dockerfile: dockerfiles/Dockerfile-for-frps
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "7000:7000"
      - "7000:7000/udp"
      - "7500:7500"
    volumes:
      - "./config/frps/frps.toml:/etc/frp/frps.toml:ro"
    networks:
      - crose-net


volumes:
  crose_pgvector:
  crose_odoo:
  crose_ai:
  crose_redis:
  crose_gmqtt:
  crose_iotdb_datas:
  crose_iotdb_logs:
  crose_nodered_prod:
  crose_nodered_staging:
  crose_verdaccio_prod:
  crose_verdaccio_staging:
  crose_webdav:
  crose-datasets:
    name: crose-datasets
  crose-loras:
    name: crose-loras
  
networks:
  crose-net:
    name: crose-net
    driver: bridge
    
