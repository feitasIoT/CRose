services:

  # 2. Nginx 容器：作为流量分发入口
  nginx:
    image: ${REGISTRY:-}nginx:alpine
    container_name: crose_nginx
    restart: unless-stopped
    ports:
      - "10080:80"
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
    networks:
      - crose-net

  db:
    image: ${REGISTRY:-}pgvector/pgvector:0.8.2-pg14-trixie
    container_name: crose_db
    restart: always
    environment:
      - POSTGRES_DB=crose
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U odoo -d crose -tAc \"SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='res_users'\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    volumes:
      - ./config/pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - crose_pgvector:/var/lib/postgresql/data
    networks:
      - crose-net

  web:
    container_name: crose_web
    build: 
      context: .
      dockerfile: ./crose/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18069:8069"
    restart: always
    volumes:
      - ./config/crose/odoo.conf:/etc/odoo/odoo.conf
      - ./crose:/mnt/extra-addons/crose
      - crose_odoo:/var/lib/odoo
      - crose-datasets:/mnt/ai-datasets
      - crose-loras:/mnt/ai-loras
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB_NAME=crose
      - CROSE_AI_DATASET_ROOT=/mnt/ai-datasets
    networks:
      - crose-net

  gmqtt:
    container_name: crose_gmqtt
    build:
      context: ./gmqtt
      dockerfile: Dockerfile
    working_dir: /gmqtt_data
    restart: always
    ports:
      - "11883:1883"
      - "18883:8883"
      - "18082:8082"
      - "18083:8083"
      - "18084:8084"
    volumes:
      - ./config/gmqtt:/etc/gmqtt
      - crose_gmqtt:/gmqtt_data
    command: ["gmqttd", "start", "-c", "/etc/gmqtt/gmqttd.yml"]
    networks:
      - crose-net

  nodered-prod:
    container_name: crose_nodered_prod
    build:
      context: ./node-red
      dockerfile: Dockerfile
    restart: always
    ports:
      - "11880:1880"
    volumes:
      - ./config/nodered-prod/settings.js:/data/settings.js
      - crose_nodered_prod:/data
      - crose_webdav:/mnt/webdav
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    environment:
      - npm_config_registry=http://nexus:8081/repository/nrnpm/
    networks:
      - crose-net

  nodered-staging:
    container_name: crose_nodered_staging
    build:
      context: ./node-red
      dockerfile: Dockerfile
    user: "0:0"
    restart: always
    ports:
      - "11881:1880"
    volumes:
      - ./config/nodered-staging/settings.js:/data/settings.js
      - crose_nodered_staging:/data
      - crose_webdav:/mnt/webdav
      - ./demo/samba:/mnt/samba
    environment:
      - npm_config_registry=http://nexus:8081/repository/npm/
    networks:
      - crose-net

  redis:
    image: ${REGISTRY:-}redis:7-alpine
    container_name: crose_redis
    restart: always
    command:
      - sh
      - -c
      - test -f /data/users.acl || touch /data/users.acl; exec redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "16379:6379"
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - crose_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crose-net

  iotdb:
    image: ${REGISTRY:-}apache/iotdb:2.0.7-standalone
    hostname: iotdb
    container_name: crose_iotdb
    restart: always
    privileged: true
    ports:
      - "16667:6667"
      - "11886:1883"
    environment:
      - cn_internal_address=127.0.0.1
      - cn_internal_port=10710
      - cn_consensus_port=10720
      - cn_seed_config_node=127.0.0.1:10710
      - dn_rpc_address=0.0.0.0
      - dn_internal_address=127.0.0.1
      - dn_rpc_port=6667
      - dn_internal_port=10730
      - dn_mpp_data_exchange_port=10740
      - dn_schema_region_consensus_port=10750
      - dn_data_region_consensus_port=10760
      - dn_seed_config_node=127.0.0.1:10710
    volumes:
      - crose_iotdb_datas:/iotdb/data
      - crose_iotdb_logs:/iotdb/logs
      - ./config/iotdb/iotdb-system.properties:/iotdb/conf/iotdb-system.properties
    networks:
      - crose-net

  webdav:
    build:
      context: ./webdav
      dockerfile: Dockerfile
    container_name: crose_webdav
    user: "0:0"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "16065:6065"
    volumes:
      - crose_webdav:/data          # 映射到容器内的 /data
      - ./config/webdav/config.yaml:/config.yaml # 需要提供一个基础配置文件
    environment:
      WD_REDIS_ENABLED: "true"
      WD_REDIS_ADDR: "redis:6379"
      WD_REDIS_KEY_PREFIX: "webdav:"
      WD_REDIS_SEED_FROM_CONFIG: "true"
    command: ["--config", "/config.yaml"]
    restart: unless-stopped
    networks:
      - crose-net
  
  frps:
    image: ${REGISTRY:-}frp/frps:local
    container_name: crose_frps
    build:
      context: ./frp
      dockerfile: dockerfiles/Dockerfile-for-frps
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "17000:7000"
      - "17000:7000/udp"
      - "17500:7500"
    volumes:
      - "./config/frps/frps.toml:/etc/frp/frps.toml:ro"
    networks:
      - crose-net

  nexus:
    image: ${REGISTRY:-}sonatype/nexus3
    container_name: crose_nexus
    restart: unless-stopped
    ports:
      - "18081:8081"
      - "18080:8080"
    environment:
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - crose-net
    

volumes:
  crose_pgvector:
  crose_odoo:
  crose_redis:
  crose_gmqtt:
  crose_iotdb_datas:
  crose_iotdb_logs:
  crose_nodered_prod:
  crose_nodered_staging:
  crose_webdav:
  crose-datasets:
    name: crose-datasets
  crose-loras:
    name: crose-loras
  nexus_data:
  gogs_data:
  
networks:
  crose-net:
    name: crose-net
    driver: bridge
    
