services:
  volume-init:
    image: ${REGISTRY:-}alpine:3.23
    container_name: crose_volume_init
    command:
      - sh
      - -lc
      - mkdir -p /mnt/ai-datasets /mnt/ai-loras && chown -R 100:101 /mnt/ai-datasets /mnt/ai-loras && chmod -R ug+rwX /mnt/ai-datasets /mnt/ai-loras
    volumes:
      - crose-datasets:/mnt/ai-datasets
      - crose-loras:/mnt/ai-loras
    restart: "no"
    networks:
      - crose-net

  ai:
    container_name: crose_ai
    build:
      context: .
      dockerfile: ./ai/Dockerfile
    restart: always
    volumes:
      - ./ai:/app
      - crose_ai:/root/.cache/torch
      - ./config/ai:/app/ai_config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "18000:8000"
    environment:
      - CROSE_TRAIN_CONTAINER_NAME=crose_ai_train
      - CROSE_TRAIN_YAML_DIR=/app/ai_config/generated
      - CROSE_TRAIN_LOG_DIR=/app/output
      - CROSE_VLLM_BASE_URL=http://vllm:8000
      - CROSE_VLLM_CHAT_API_PATH=/v1/chat/completions
      - CROSE_VLLM_LOAD_ADAPTER_API_PATH=/v1/load_lora_adapter
      - CROSE_VLLM_UNLOAD_ADAPTER_API_PATH=/v1/unload_lora_adapter
    networks:
      - crose-net

  vllm:
    image: vllm/vllm-openai:latest
    container_name: crose_vllm
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_ALLOW_RUNTIME_LORA_UPDATING=True
    ports:
      - "18002:8000"
    volumes:
      - crose-models:/root/.cache/huggingface
      - crose-loras:/app/lora_adapters:ro
    # 针对 2060 6GB 的极限优化参数
    command: >
      --model Qwen/Qwen2-1.5B-Instruct-AWQ
      --quantization awq
      --enable-lora
      --max-loras 2
      --max-lora-rank 64
      --gpu-memory-utilization 0.6
      --max-model-len 1024
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - crose-net

  ai-train:
    image: hiyouga/llamafactory:latest
    container_name: crose_ai_train
    runtime: nvidia
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "18001:8000"
    volumes:
      - crose-models:/root/.cache/huggingface    # 模型持久化存储
      - ./config/ai:/app/ai_config           # 映射配置文件夹
      - crose-datasets:/app/data # 共享数据集
      - crose-loras:/app/output # 训练产出直接存入共享卷
    command: llamafactory-cli api /app/ai_config/inference_qwen.yaml
    networks:
      - crose-net

volumes:
  crose_ai:
    name: crose_ai
  crose-models:
    name: crose-models
  crose-datasets:
    name: crose-datasets
  crose-loras:
    name: crose-loras

networks:
  crose-net:
    name: crose-net
    external: true
    
